<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f7f7f4">
  <title>今日清单 · ToDoList</title>
  <style>
    :root {
      color-scheme: light;
      --paper: #f7f7f4;
      --surface: #fff;
      --ink: #20231f;
      --muted: #858a82;
      --line: #e9ebe5;
      --green: #52745b;
      --green-dark: #3e6148;
      --green-soft: #edf3ed;
      --orange: #d78b62;
      --shadow: 0 18px 55px rgba(38, 49, 38, .07);
    }
    * { box-sizing: border-box; }
    body {
      min-height: 100vh;
      margin: 0;
      padding: 54px 20px 64px;
      background: var(--paper);
      color: var(--ink);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
    }
    button, input { font: inherit; }
    button { color: inherit; }
    .app { width: min(100%, 760px); margin: 0 auto; }
    .topline { display: flex; align-items: center; justify-content: space-between; margin-bottom: 36px; }
    .brand { display: flex; gap: 10px; align-items: center; color: var(--green-dark); font-size: 14px; font-weight: 700; letter-spacing: .08em; }
    .brand-mark { display: grid; width: 30px; height: 30px; place-items: center; border-radius: 10px; background: var(--green); color: white; }
    .today { color: var(--muted); font-size: 13px; }
    .intro { margin-bottom: 30px; }
    .eyebrow { margin: 0 0 9px; color: var(--green); font-size: 12px; font-weight: 700; letter-spacing: .12em; text-transform: uppercase; }
    h1 { margin: 0; font-size: clamp(30px, 5vw, 42px); font-weight: 650; letter-spacing: -.045em; line-height: 1.2; }
    .subtitle { margin: 12px 0 0; color: var(--muted); font-size: 15px; }
    .card { overflow: hidden; border: 1px solid #eceee8; border-radius: 20px; background: var(--surface); box-shadow: var(--shadow); }
    .composer { display: flex; gap: 12px; padding: 20px; border-bottom: 1px solid var(--line); }
    .input-wrap { display: flex; flex: 1; align-items: center; gap: 12px; min-width: 0; padding: 0 15px; border: 1px solid var(--line); border-radius: 12px; background: #fbfcfa; transition: border-color .2s, box-shadow .2s; }
    .input-wrap:focus-within { border-color: #a8b9a8; box-shadow: 0 0 0 3px rgba(82,116,91,.09); }
    .input-plus { color: var(--green); font-size: 22px; font-weight: 300; }
    #taskInput { width: 100%; min-width: 0; height: 48px; border: 0; outline: 0; background: transparent; color: var(--ink); font-size: 15px; }
    #taskInput::placeholder { color: #a5aaa2; }
    .add-btn { flex: 0 0 auto; padding: 0 20px; border: 0; border-radius: 12px; background: var(--green); color: white; font-size: 14px; font-weight: 650; cursor: pointer; transition: background .2s, transform .2s; }
    .add-btn:hover { background: var(--green-dark); transform: translateY(-1px); }
    .toolbar { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 17px 22px 13px; }
    .filters { display: flex; gap: 5px; }
    .filter { padding: 8px 12px; border: 0; border-radius: 9px; background: transparent; color: var(--muted); font-size: 13px; cursor: pointer; transition: background .2s, color .2s; }
    .filter:hover { color: var(--ink); }
    .filter.active { background: var(--green-soft); color: var(--green-dark); font-weight: 650; }
    .remaining { color: var(--muted); font-size: 12px; white-space: nowrap; }
    .task-list { min-height: 170px; padding: 0 22px; }
    .task-row { display: flex; align-items: center; gap: 14px; min-height: 64px; border-bottom: 1px solid #f0f1ed; animation: appear .22s ease-out; }
    .task-row:last-child { border-bottom: 0; }
    @keyframes appear { from { opacity: 0; transform: translateY(5px); } to { opacity: 1; transform: translateY(0); } }
    .check { display: grid; flex: 0 0 21px; width: 21px; height: 21px; place-items: center; padding: 0; border: 1.5px solid #cbd0c8; border-radius: 50%; background: white; color: white; cursor: pointer; transition: all .18s; }
    .check:hover { border-color: var(--green); background: var(--green-soft); }
    .task-row.done .check { border-color: var(--green); background: var(--green); }
    .check svg { width: 12px; height: 12px; }
    .task-text { flex: 1; min-width: 0; overflow-wrap: anywhere; font-size: 14px; line-height: 1.55; }
    .task-row.done .task-text { color: #a0a59e; text-decoration: line-through; text-decoration-thickness: 1px; }
    .delete-btn { display: grid; width: 32px; height: 32px; flex: 0 0 32px; place-items: center; border: 0; border-radius: 9px; background: transparent; color: #adb1aa; opacity: 0; cursor: pointer; transition: all .18s; }
    .task-row:hover .delete-btn, .delete-btn:focus-visible { opacity: 1; }
    .delete-btn:hover { background: #fff0eb; color: #bd674b; }
    .delete-btn svg { width: 16px; height: 16px; }
    .empty { display: flex; min-height: 170px; flex-direction: column; align-items: center; justify-content: center; color: var(--muted); text-align: center; }
    .empty-icon { display: grid; width: 48px; height: 48px; margin-bottom: 12px; place-items: center; border-radius: 16px; background: #f3f5f1; color: var(--green); }
    .empty-icon svg { width: 23px; height: 23px; }
    .empty-title { margin: 0; color: #62685f; font-size: 14px; font-weight: 600; }
    .empty-hint { margin: 6px 0 0; font-size: 12px; }
    .card-footer { display: flex; min-height: 52px; align-items: center; justify-content: space-between; gap: 12px; padding: 0 22px; border-top: 1px solid var(--line); color: var(--muted); font-size: 12px; }
    .clear-btn { padding: 7px 0 7px 8px; border: 0; background: transparent; color: #92978f; font-size: 12px; cursor: pointer; }
    .clear-btn:hover:not(:disabled) { color: #bd674b; }
    .clear-btn:disabled { opacity: .38; cursor: default; }
    .progress { display: flex; align-items: center; gap: 9px; }
    .progress-track { width: 72px; height: 4px; overflow: hidden; border-radius: 10px; background: #edf0ea; }
    .progress-fill { width: 0; height: 100%; border-radius: inherit; background: var(--green); transition: width .25s; }
    .tip { margin: 20px 2px 0; color: #a0a59e; font-size: 12px; text-align: center; }
    @media (max-width: 560px) {
      body { padding: 30px 15px 40px; }
      .topline { margin-bottom: 30px; }
      .intro { margin-bottom: 23px; }
      .composer { gap: 9px; padding: 14px; }
      .add-btn { padding: 0 15px; }
      .toolbar { padding: 14px 15px 10px; }
      .filter { padding: 8px 9px; }
      .task-list { padding: 0 15px; }
      .card-footer { padding: 0 15px; }
      .delete-btn { opacity: 1; }
      .progress-track { width: 52px; }
    }
    @media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation-duration: .01ms !important; transition-duration: .01ms !important; } }
  </style>
</head>
<body>
  <main class="app">
    <header class="topline">
      <div class="brand"><span class="brand-mark" aria-hidden="true">✓</span><span>MORI · DAILY</span></div>
      <time class="today" id="today"></time>
    </header>

    <section class="intro" aria-labelledby="pageTitle">
      <p class="eyebrow">A little progress, every day</p>
      <h1 id="pageTitle">把今天，慢慢完成。</h1>
      <p class="subtitle">专注眼前的一件事，剩下的交给时间。</p>
    </section>

    <section class="card" aria-label="待办事项清单">
      <form class="composer" id="taskForm">
        <label class="input-wrap" for="taskInput"><span class="input-plus" aria-hidden="true">＋</span><input id="taskInput" type="text" maxlength="120" placeholder="添加一件想完成的事…" autocomplete="off" aria-label="待办事项内容"></label>
        <button class="add-btn" type="submit">添加任务</button>
      </form>
      <div class="toolbar">
        <nav class="filters" aria-label="筛选任务">
          <button class="filter active" type="button" data-filter="all" aria-pressed="true">全部</button>
          <button class="filter" type="button" data-filter="active" aria-pressed="false">待完成</button>
          <button class="filter" type="button" data-filter="completed" aria-pressed="false">已完成</button>
        </nav>
        <span class="remaining" id="remaining">0 项待完成</span>
      </div>
      <div class="task-list" id="taskList" aria-live="polite"></div>
      <footer class="card-footer">
        <div class="progress"><span id="progressLabel">完成进度 0%</span><span class="progress-track" aria-hidden="true"><span class="progress-fill" id="progressFill"></span></span></div>
        <button class="clear-btn" id="clearCompleted" type="button" disabled>清除已完成</button>
      </footer>
    </section>
    <p class="tip">小提示：按 <kbd>Enter</kbd> 快速添加任务</p>
  </main>

  <script>
    (() => {
      const STORAGE_KEY = 'mori-todolist-v1';
      const taskForm = document.querySelector('#taskForm');
      const taskInput = document.querySelector('#taskInput');
      const taskList = document.querySelector('#taskList');
      const remaining = document.querySelector('#remaining');
      const clearCompleted = document.querySelector('#clearCompleted');
      const progressLabel = document.querySelector('#progressLabel');
      const progressFill = document.querySelector('#progressFill');
      const filterButtons = [...document.querySelectorAll('.filter')];
      const today = document.querySelector('#today');
      let filter = 'all';
      let tasks = readTasks();

      today.textContent = new Intl.DateTimeFormat('zh-CN', { year: 'numeric', month: 'long', day: 'numeric', weekday: 'long' }).format(new Date());

      function readTasks() {
        try {
          const saved = JSON.parse(localStorage.getItem(STORAGE_KEY) || '[]');
          return Array.isArray(saved) ? saved.filter(task => task && typeof task.id === 'string' && typeof task.text === 'string' && typeof task.completed === 'boolean') : [];
        } catch { return []; }
      }

      function saveTasks() {
        try { localStorage.setItem(STORAGE_KEY, JSON.stringify(tasks)); }
        catch { /* The list remains usable when browser storage is unavailable. */ }
      }

      function render() {
        const activeCount = tasks.filter(task => !task.completed).length;
        const completedCount = tasks.length - activeCount;
        const percent = tasks.length ? Math.round(completedCount / tasks.length * 100) : 0;
        remaining.textContent = `${activeCount} 项待完成`;
        progressLabel.textContent = `完成进度 ${percent}%`;
        progressFill.style.width = `${percent}%`;
        clearCompleted.disabled = completedCount === 0;
        taskList.replaceChildren();

        const shownTasks = tasks.filter(task => filter === 'all' || (filter === 'active' ? !task.completed : task.completed));
        if (!shownTasks.length) {
          const isEmptyList = tasks.length === 0;
          const empty = document.createElement('div');
          empty.className = 'empty';
          empty.innerHTML = `<span class="empty-icon" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M8 5.5h10a2 2 0 0 1 2 2v11a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2v-11a2 2 0 0 1 2-2Z"/><path d="M9 3.5h6M9 10h7M9 14h7M9 18h4"/><path d="m3 11 1.3 1.3L6.5 10"/></svg></span><p class="empty-title">${isEmptyList ? '今天还没有安排' : filter === 'active' ? '太棒了，任务都完成了' : '还没有完成的任务'}</p><p class="empty-hint">${isEmptyList ? '从一件小事开始，给今天一个方向。' : '完成的事项会出现在这里。'}</p>`;
          taskList.append(empty);
          return;
        }

        for (const task of shownTasks) {
          const row = document.createElement('div');
          row.className = `task-row${task.completed ? ' done' : ''}`;
          const check = document.createElement('button');
          check.type = 'button';
          check.className = 'check';
          check.setAttribute('aria-label', task.completed ? `标记为待完成：${task.text}` : `标记为已完成：${task.text}`);
          check.setAttribute('aria-pressed', String(task.completed));
          if (task.completed) check.innerHTML = '<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m3.5 8 3 3 6-6"/></svg>';
          check.addEventListener('click', () => toggleTask(task.id));

          const text = document.createElement('span');
          text.className = 'task-text';
          text.textContent = task.text;

          const remove = document.createElement('button');
          remove.type = 'button';
          remove.className = 'delete-btn';
          remove.setAttribute('aria-label', `删除任务：${task.text}`);
          remove.innerHTML = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 7h16M10 11v6M14 11v6M5.5 7l1 13h11l1-13M9 7V4h6v3"/></svg>';
          remove.addEventListener('click', () => deleteTask(task.id));
          row.append(check, text, remove);
          taskList.append(row);
        }
      }

      function toggleTask(id) {
        tasks = tasks.map(task => task.id === id ? { ...task, completed: !task.completed } : task);
        saveTasks();
        render();
      }

      function deleteTask(id) {
        tasks = tasks.filter(task => task.id !== id);
        saveTasks();
        render();
      }

      taskForm.addEventListener('submit', event => {
        event.preventDefault();
        const text = taskInput.value.trim();
        if (!text) { taskInput.focus(); return; }
        tasks.unshift({ id: crypto.randomUUID ? crypto.randomUUID() : `${Date.now()}-${Math.random()}`, text, completed: false });
        taskInput.value = '';
        saveTasks();
        render();
        taskInput.focus();
      });

      filterButtons.forEach(button => button.addEventListener('click', () => {
        filter = button.dataset.filter;
        filterButtons.forEach(item => {
          const selected = item === button;
          item.classList.toggle('active', selected);
          item.setAttribute('aria-pressed', String(selected));
        });
        render();
      }));

      clearCompleted.addEventListener('click', () => {
        tasks = tasks.filter(task => !task.completed);
        saveTasks();
        render();
      });

      render();
    })();
  </script>
</body>
</html>
